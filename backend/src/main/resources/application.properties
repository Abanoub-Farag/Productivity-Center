spring.application.name=productivity-center

# Database Configuration (Internal Container Network Ports)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# JWT Configuration
jwt.secretkey=${JWT_SECRET_KEY}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION}
jwt.tokenExpiration=${JWT_EXPIRATION}

# Flyway Configuration (Reuses DataSource automatically)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Redis Configuration (Internal Container Port)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.type=redis