<div class="session-layout">
  <!-- ═══════════════════════════ LEFT SIDEBAR ═══════════════════════════ -->
  <app-sidebar class="session-sidebar"></app-sidebar>

  <!-- ═══════════════════════════ MAIN CONTENT ══════════════════════════ -->
  <div class="session-main">

    <!-- ── Top Header Bar ───────────────────────────────────────────────── -->
    <app-room-header
      [room]="room()"
      [heartbeatStatus]="heartbeatStatus()"
      [isFavorite]="isFavorite()"
      [isPendingFavorite]="isPendingFavorite()"
      [isOwner]="isOwner()"
      (toggleFavorite)="toggleFavorite()"
      (editRoom)="openEditRoomModal()"
      (deleteRoom)="openDeleteRoomModal()"
    ></app-room-header>

    <!-- ── Body: 3-column layout (people | timer | tasks) ────────────────── -->
    <div class="session-body">

      <!-- ═══ LEFT COLUMN: Online Participants ═══════════════════════════════ -->
      <section class="split-panel participants-panel" aria-label="Room Members">
        @if (roomId()) {
          <app-room-members-list [roomId]="roomId()!"></app-room-members-list>
        }
      </section>

      <!-- ═══ CENTER COLUMN: Pomodoro Timer ═══════════════════════════════ -->
      <app-room-timer></app-room-timer>

      <!-- ═══ RIGHT COLUMN: Session Tasks ════════════════════════════════ -->
      <app-room-task-panel
        [tasks]="tasks()"
        [isTasksLoading]="isTasksLoading()"
        [tasksError]="tasksError()"
        [taskUpdateError]="taskUpdateError()"
        [updatingTaskId]="updatingTaskId()"
        [newTaskText]="newTaskText()"
        [editingTaskId]="editingTaskId()"
        [editingTaskTitle]="editingTaskTitle()"
        (onAddTask)="addTask()"
        (onNewTaskInput)="onNewTaskInput($event)"
        (onNewTaskKeydown)="onNewTaskKeydown($event)"
        (onFetchTasks)="fetchTasks()"
        (onToggleTask)="toggleTask($event)"
        (onStartEditTask)="startEditTask($event)"
        (onDeleteTask)="deleteTask($event)"
        (onEditTaskInput)="onEditTaskInput($event)"
        (onSaveTaskTitle)="saveTaskTitle($event)"
        (onCancelEditTask)="cancelEditTask()"
      ></app-room-task-panel>

    </div><!-- /session-body -->

  </div><!-- /session-main -->

  <!-- ═══ Edit Room Modal ═════════════════════════════════════════════════ -->
  <div class="modal-overlay" *ngIf="isEditRoomModalOpen()" (click)="closeEditRoomModal()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Edit Room Details</h2>
        <button type="button" class="icon-btn close-modal-btn" (click)="closeEditRoomModal()" aria-label="Close modal">
          <lucide-icon [img]="XIcon" class="btn-icon"></lucide-icon>
        </button>
      </div>
      <form (submit)="$event.preventDefault(); submitUpdateRoom()" class="modal-form">
        <div class="form-group">
          <label for="edit-room-title">Room Title</label>
          <input
            id="edit-room-title"
            type="text"
            class="form-control"
            [value]="editRoomTitle()"
            (input)="onEditRoomTitleInput($event)"
            placeholder="Enter room title"
            required
            maxlength="50"
          />
        </div>
        <div class="form-group">
          <label for="edit-room-description">Description</label>
          <textarea
            id="edit-room-description"
            class="form-control textarea"
            [value]="editRoomDescription()"
            (input)="onEditRoomDescriptionInput($event)"
            placeholder="Enter room description"
            rows="3"
          ></textarea>
        </div>
        <div class="form-group">
          <label for="edit-room-visibility">Visibility</label>
          <select 
            id="edit-room-visibility"
            class="form-control"
            [ngModel]="editRoomVisibility()"
            (ngModelChange)="roomState.setEditRoomVisibility($event)"
            name="visibility"
          >
            <option value="PUBLIC">Public</option>
            <option value="PRIVATE">Private</option>
          </select>
        </div>
        <div class="modal-error" *ngIf="roomUpdateError()">
          <p>{{ roomUpdateError() }}</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeEditRoomModal()" [disabled]="isUpdatingRoom()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="isUpdatingRoom()">
            {{ isUpdatingRoom() ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══ Delete Room Confirmation Modal ══════════════════════════════════ -->
  <div class="modal-overlay" *ngIf="isDeleteRoomModalOpen()" (click)="closeDeleteRoomModal()">
    <div class="modal-card modal-card--danger" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Delete Room</h2>
        <button type="button" class="icon-btn close-modal-btn" (click)="closeDeleteRoomModal()" aria-label="Close modal">
          <lucide-icon [img]="XIcon" class="btn-icon"></lucide-icon>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong>"{{ room()?.title }}"</strong>? This action cannot be undone.</p>
        <div class="modal-error" *ngIf="roomDeleteError()">
          <p>{{ roomDeleteError() }}</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDeleteRoomModal()" [disabled]="isDeletingRoom()">
          Cancel
        </button>
        <button type="button" class="btn btn-danger" (click)="confirmDeleteRoom()" [disabled]="isDeletingRoom()">
          {{ isDeletingRoom() ? 'Deleting...' : 'Delete Room' }}
        </button>
      </div>
    </div>
  </div>

</div>
