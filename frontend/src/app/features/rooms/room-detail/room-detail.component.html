<div class="session-layout">
  <!-- ═══════════════════════════ LEFT SIDEBAR ═══════════════════════════ -->
  <app-sidebar class="session-sidebar"></app-sidebar>

  <!-- ═══════════════════════════ MAIN CONTENT ══════════════════════════ -->
  <div class="session-main">

    <!-- ── Top Header Bar ───────────────────────────────────────────────── -->
    <app-room-header
      [room]="roomState.room()"
      [isFavorite]="roomState.isFavorite()"
      [isPendingFavorite]="roomState.isPendingFavorite()"
      [isOwner]="roomState.isOwner()"
      (toggleFavorite)="roomState.toggleFavorite()"
      (editRoom)="openEditRoomModal()"
      (deleteRoom)="roomState.openDeleteRoomModal()"
    ></app-room-header>

    <!-- ── Body: 3-column layout (people | timer | tasks) ────────────────── -->
    <div class="session-body">

      <!-- ═══ LEFT COLUMN: Online Participants ═══════════════════════════════ -->
      <section class="split-panel participants-panel" aria-label="Room Members">
        @if (roomState.roomId()) {
          <app-room-members-list
            [roomId]="roomState.roomId()!"
            [refreshTrigger]="roomState.heartbeatTick()">
          </app-room-members-list>
        }
      </section>

      <!-- ═══ CENTER COLUMN: Pomodoro Timer ═══════════════════════════════ -->
      <app-room-timer
        [mode]="timer.timerMode()"
        [timerStatus]="timer.timerStatus()"
        [displaySeconds]="timer.timerDisplaySeconds()"
        [pomodoroDuration]="timer.pomodoroDuration()"
        [ringFraction]="timer.timerRingFraction()"
        [isLoading]="timer.isTimerLoading()"
        [timerError]="timer.timerError()"
        [lastSessionDuration]="timer.lastSessionDuration()"
        [isStopConfirmOpen]="timer.isStopConfirmOpen()"
        (startTimer)="timer.startTimer()"
        (requestStop)="timer.requestStopTimer()"
        (confirmStop)="timer.confirmStopTimer()"
        (cancelStop)="timer.cancelStopTimer()"
        (modeChange)="timer.setTimerMode($event)"
        (pomodoroDurationChange)="timer.setPomodoroDuration($event)"
        (dismissError)="timer.dismissTimerError()"
      ></app-room-timer>

      <!-- ═══ RIGHT COLUMN: Session Tasks ════════════════════════════════ -->
      <app-room-task-panel
        [tasks]="tasks.tasks()"
        [isTasksLoading]="tasks.isTasksLoading()"
        [tasksError]="tasks.tasksError()"
        [taskUpdateError]="tasks.taskUpdateError()"
        [updatingTaskId]="tasks.updatingTaskId()"
        [newTaskText]="tasks.newTaskText()"
        [editingTaskId]="tasks.editingTaskId()"
        [editingTaskTitle]="tasks.editingTaskTitle()"
        (onAddTask)="tasks.addTask()"
        (onNewTaskInput)="onNewTaskInput($event)"
        (onNewTaskKeydown)="onNewTaskKeydown($event)"
        (onFetchTasks)="tasks.fetchTasks()"
        (onToggleTask)="tasks.toggleTask($event)"
        (onStartEditTask)="tasks.startEditTask($event)"
        (onDeleteTask)="tasks.deleteTask($event)"
        (onEditTaskInput)="onEditTaskInput($event)"
        (onSaveTaskTitle)="tasks.saveTaskTitle($event)"
        (onCancelEditTask)="tasks.cancelEditTask()"
      ></app-room-task-panel>

    </div><!-- /session-body -->

  </div><!-- /session-main -->

  <!-- ═══ Edit Room Modal (shared component) ═════════════════════════════════ -->
  @if (editingRoom()) {
    <app-edit-room-modal
      [room]="editingRoom()!"
      (onSave)="onSaveRoom($event)"
      (onClose)="onCloseModal()">
    </app-edit-room-modal>
  }

  <!-- ═══ Delete Room Confirmation Modal ══════════════════════════════════ -->
  @if (roomState.isDeleteRoomModalOpen()) {
    <div class="modal-overlay" (click)="roomState.closeDeleteRoomModal()">
      <div class="modal-card modal-card--danger" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2>Delete Room</h2>
          <button type="button" class="icon-btn close-modal-btn" (click)="roomState.closeDeleteRoomModal()" aria-label="Close modal">
            <lucide-icon [img]="XIcon" class="btn-icon"></lucide-icon>
          </button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong>"{{ roomState.room()?.title }}"</strong>? This action cannot be undone.</p>
          @if (roomState.roomDeleteError()) {
            <div class="modal-error">
              <p>{{ roomState.roomDeleteError() }}</p>
            </div>
          }
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="roomState.closeDeleteRoomModal()" [disabled]="roomState.isDeletingRoom()">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" (click)="roomState.confirmDeleteRoom()" [disabled]="roomState.isDeletingRoom()">
            {{ roomState.isDeletingRoom() ? 'Deleting...' : 'Delete Room' }}
          </button>
        </div>
      </div>
    </div>
  }

</div>
