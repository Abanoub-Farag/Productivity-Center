<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <div class="sidebar__brand">
    <div class="brand-left">
      <div class="brand-logo">
        <span>PC</span>
      </div>
      <span class="brand-title">PCenter</span>
    </div>

    <button 
      type="button" 
      class="collapse-btn" 
      (click)="toggleCollapse()"
      [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <lucide-icon [img]="isCollapsed() ? ChevronRightIcon : ChevronLeftIcon" class="collapse-icon"></lucide-icon>
    </button>
  </div>

  <div class="sidebar__profile" [title]="isCollapsed() ? userName() : ''">
    <div class="profile-avatar">
      <div class="avatar-initials">{{ userInitials() }}</div>
      <span class="status-indicator"></span>
    </div>
    <div class="profile-info">
      <span class="profile-name">{{ userName() }}</span>
      <span class="profile-status">Online</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.label) {
    <a [routerLink]="item.route ? item.route : null"
       class="nav-item"
       [routerLinkActive]="item.route ? 'active' : ''"
       [routerLinkActiveOptions]="{exact: false}"
       [class.active]="item.active"
       [title]="isCollapsed() ? item.label : ''">
      <div class="active-indicator"></div>
      <lucide-icon [img]="item.icon" class="nav-icon"></lucide-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
    }
  </nav>

  <div class="sidebar__footer">
    <a (click)="logout()"
       class="nav-item logout-btn" 
       [title]="isCollapsed() ? 'Logout' : ''"
       style="cursor: pointer;">
      <lucide-icon [img]="LogOutIcon" class="nav-icon"></lucide-icon>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</aside>
