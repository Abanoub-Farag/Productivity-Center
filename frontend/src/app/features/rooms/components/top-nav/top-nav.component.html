<header class="top-nav">
  <div class="top-nav__title">
    <h1>My Rooms</h1>
  </div>

  <div class="top-nav__actions">
    <div class="search-container">
      <lucide-icon [img]="SearchIcon" class="search-icon"></lucide-icon>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Search for rooms or users..." 
        (input)="onSearch($event)" />
    </div>

    <button class="notification-btn">
      <lucide-icon [img]="BellIcon" class="bell-icon"></lucide-icon>
      <span class="notification-dot"></span>
    </button>

    <app-room-action-button></app-room-action-button>
  </div>
</header>
